<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>カカオクランチ・ディストリビューター</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #333;
            color: white;
            font-family: sans-serif;
            margin-top: 50px;
        }
        canvas {
            background-color: #f4f4f9;
            border: 4px solid #8b4513;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .instructions {
            margin-top: 20px;
            text-align: center;
        }
        kbd {
            background: #eee;
            color: #333;
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <h1>🍫 カカオクランチ・ディストリビューター 🍫</h1>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    
    <div class="instructions">
        <p>【操作方法】</p>
        <p>上下移動: <kbd>↑</kbd> <kbd>↓</kbd> キー</p>
        <p>カカオクランチを投げる: <kbd>スペース</kbd> キー</p>
        <p>迫りくるお疲れの同僚たちにチョコをぶつけて撃沈（リフレッシュ）させよう！<br>同僚に左端まで到達されるとゲームオーバーです。</p>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ゲームの基本設定
    let score = 0;
    let gameOver = false;
    let frameCount = 0;

    // プレイヤー（配る男性）
    const player = {
        x: 50,
        y: 250,
        size: 40,
        emoji: '👨🏻‍💼',
        speed: 6
    };

    // 飛び交うチョコとターゲット
    let chocolates = [];
    let coworkers = [];

    // キー入力状態
    const keys = {};

    window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        // スペースキーでチョコを投げる（連射制限なしの全力投球）
        if (e.code === 'Space' && !gameOver) {
            chocolates.push({
                x: player.x + 30,
                y: player.y,
                size: 25,
                emoji: '🍫',
                speed: 10
            });
            e.preventDefault(); // 画面スクロール防止
        }
    });

    window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
    });

    // 敵（同僚）の生成
    function spawnCoworker() {
        if (frameCount % 60 === 0) { // 1秒ごとに生成
            const emojis = ['👨‍💻', '👩‍💻', '🙎‍♂️', '🙎‍♀️', '🧟‍♂️']; // たまにゾンビ化した社員がいます
            coworkers.push({
                x: 800,
                y: Math.random() * 400 + 50,
                size: 40,
                emoji: emojis[Math.floor(Math.random() * emojis.length)],
                speed: 2 + Math.random() * 3 // スピードはランダム
            });
        }
    }

    // 更新処理
    function update() {
        if (gameOver) return;
        frameCount++;

        // プレイヤーの移動
        if (keys['ArrowUp'] && player.y > 30) player.y -= player.speed;
        if (keys['ArrowDown'] && player.y < canvas.height - 30) player.y += player.speed;

        // チョコの移動
        chocolates.forEach((choco, index) => {
            choco.x += choco.speed;
            // 画面外に出たら消去
            if (choco.x > 800) chocolates.splice(index, 1);
        });

        // 同僚の移動と当たり判定
        spawnCoworker();
        for (let i = coworkers.length - 1; i >= 0; i--) {
            let c = coworkers[i];
            c.x -= c.speed;

            // 左端に到達したらゲームオーバー
            if (c.x < 0) {
                gameOver = true;
            }

            // チョコとの当たり判定
            for (let j = chocolates.length - 1; j >= 0; j--) {
                let choco = chocolates[j];
                let dist = Math.hypot(c.x - choco.x, c.y - choco.y);
                if (dist < 30) {
                    // 命中！（撃沈）
                    coworkers.splice(i, 1);
                    chocolates.splice(j, 1);
                    score += 10;
                    break;
                }
            }
        }
    }

    // 描画処理
    function draw() {
        // オフィスの背景
        ctx.fillStyle = '#f4f4f9';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // オフィスの床の線（飾り）
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 2;
        for(let i=0; i<800; i+=100) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 500); ctx.stroke();
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // プレイヤー描画
        ctx.font = '40px sans-serif';
        ctx.fillText(player.emoji, player.x, player.y);

        // チョコ描画
        ctx.font = '25px sans-serif';
        chocolates.forEach(choco => {
            ctx.fillText(choco.emoji, choco.x, choco.y);
        });

        // 同僚描画
        ctx.font = '40px sans-serif';
        coworkers.forEach(c => {
            ctx.fillText(c.emoji, c.x, c.y);
        });

        // スコア表示
        ctx.fillStyle = '#333';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('配った数: ' + (score / 10) + ' 個', 20, 30);

        // ゲームオーバー表示
        if (gameOver) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.font = 'bold 50px sans-serif';
            ctx.fillText('ゲームオーバー！', canvas.width / 2, canvas.height / 2 - 20);
            ctx.font = '24px sans-serif';
            ctx.fillText('F5キーを押して再チャレンジ', canvas.width / 2, canvas.height / 2 + 30);
        }
    }

    // メインループ
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ゲーム開始
    gameLoop();
</script>
</body>
</html>
